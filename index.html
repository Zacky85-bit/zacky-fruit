<title>Z'acky Fruit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Concept : plateau vert profond comme une feuille de bananier, fruits ivoiriens sur pastilles pastel, gros chiffres pour les coups restants. */
/* Concept : décor vert profond, gros boutons en relief, carte des niveaux en chemin pointillé. */
:root {
  --bg: #0b1a12;
  --surface: #17241c;
  --fg: #eaf3ec;
  --muted: #9db0a3;
  --line: #2c3e32;
  --green: #3fbf75;
  --on-green: #06150c;
  --orange: #ff9a2e;
  --on-orange: #1a1200;
  --gold: #ffd43b;
  --panel: #184a2f;
  --font-display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 16px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 460px; margin: 0 auto; }
section { display: flex; flex-direction: column; gap: 14px; }
h1, h2 { font-family: var(--font-display); font-weight: 800; line-height: 1.05; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.4rem, 11vw, 3.4rem); letter-spacing: -0.02em; }
h2 { font-size: 1.6rem; }
p { margin: 0; }
.lead { color: var(--muted); font-size: 1.05rem; }
.small { color: var(--muted); font-size: 0.9rem; }
.btn {
  font: inherit; font-weight: 700; font-size: 1.05rem; cursor: pointer; border: 0; border-radius: 12px;
  padding: 14px 18px; min-height: 52px; width: 100%; text-decoration: none; text-align: center;
  display: flex; align-items: center; justify-content: center;
}
.btn:focus-visible, .lv:focus-visible, .link:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.btn-main { background: var(--orange); color: var(--on-orange); }
.btn-green { background: var(--green); color: var(--on-green); }
.btn-alt { background: transparent; color: var(--fg); border: 2px solid var(--line); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; min-width: 0; }
.fruits { display: flex; gap: 8px; }
.fruits .mini { flex: 1; aspect-ratio: 1; }
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.lv {
  font: inherit; font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; cursor: pointer;
  background: var(--surface); color: var(--fg); border: 2px solid var(--line); border-radius: 12px; min-height: 52px;
}
.lv:disabled { opacity: 0.4; cursor: default; }
.lv.cur { border-color: var(--orange); }
.hud { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.hud .lab { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
.hud .val { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1; font-variant-numeric: tabular-nums; }
.hud .mid { text-align: center; }
.hud .mid .val { font-size: 2.6rem; }
.hud .right { text-align: right; }
.goals { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 4px; font-weight: 700; font-variant-numeric: tabular-nums; }
.chip.done { border-color: var(--green); }
.chip .mini { width: 30px; height: 30px; }
.mini { border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.mini svg { width: 78%; height: 78%; }
.t0 { background: linear-gradient(160deg, #fff3e0, #ffcf9e); } .t1 { background: linear-gradient(160deg, #fffbe0, #ffe98a); } .t2 { background: linear-gradient(160deg, #f3fbd6, #d3ec8f); } .t3 { background: linear-gradient(160deg, #fde8e1, #f3b9a8); } .t4 { background: linear-gradient(160deg, #f4eadf, #d6bfa8); }
.wrap { position: relative; }
.board { position: relative; width: 100%; aspect-ratio: 1; background: var(--panel); border-radius: 16px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.tile { position: absolute; left: 0; top: 0; width: calc(100% / 7); height: calc(100% / 7); transform: translate(calc(var(--c) * 100%), calc(var(--r) * 100%)); transition: transform 0.22s ease; cursor: pointer; }
.face { position: absolute; inset: 5%; border-radius: 14px; display: flex; align-items: center; justify-content: center; transition: transform 0.2s, opacity 0.2s; }
.face svg { width: 80%; height: 80%; pointer-events: none; }
.tile.sel .face { outline: 3px solid var(--orange); transform: scale(0.9); }
.tile.pop .face { transform: scale(0.1) rotate(25deg); opacity: 0; }
.toast { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--orange); color: var(--on-orange); font-weight: 800; padding: 6px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 3; white-space: nowrap; }
.toast.on { opacity: 1; }
.over { position: absolute; inset: 0; background: rgba(8, 20, 13, 0.72); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; border-radius: 16px; }
.over .box { background: var(--surface); color: var(--fg); border-radius: 16px; padding: 20px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
.stars { font-size: 2rem; letter-spacing: 6px; color: var(--orange); line-height: 1; }
.top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px 10px; }
.link { font: inherit; font-weight: 700; background: none; border: 0; color: var(--fg); cursor: pointer; padding: 8px 0; text-decoration: underline; }
.snds { display: flex; gap: 8px; flex-wrap: wrap; }
.tg { font: inherit; font-size: 0.85rem; font-weight: 700; cursor: pointer; background: transparent; color: var(--fg); border: 2px solid var(--line); border-radius: 999px; padding: 6px 12px; min-height: 36px; }
.tg[aria-pressed="false"] { opacity: 0.55; }
.tg:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.board { background-image: repeating-conic-gradient(rgba(255,255,255,.06) 0 25%, transparent 0 50%); background-size: calc(100% / 3.5) calc(100% / 3.5); box-shadow: inset 0 0 0 3px rgba(0,0,0,.18); }
.face { box-shadow: inset 0 2px 0 rgba(255,255,255,.7), inset 0 -3px 0 rgba(0,0,0,.14), 0 2px 4px rgba(0,0,0,.25); }
.chip .face, .mini { box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 0 rgba(0,0,0,.12); }
.t5 { background: linear-gradient(160deg, #ffeedd, #ffb88a); }
.face.sp { animation: pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { from { filter: brightness(1); } to { filter: brightness(1.22) drop-shadow(0 0 5px #ffb703); } }
.face.sp::after { position: absolute; right: -3%; bottom: -3%; width: 38%; height: 38%; border-radius: 50%; background: #fff; color: #14231a; font-weight: 800; font-size: 0.85rem; line-height: 1; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(0,0,0,.45); }
.sp-h::after { content: "\2194"; } .sp-v::after { content: "\2195"; } .sp-x::after { content: "\2738"; } .sp-b::after { content: "\2605"; }
.face.sp-b { background: conic-gradient(#ff8787, #ffe066, #8ce99a, #74c0fc, #e599f7, #ff8787); }
.rules { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 0.95rem; }
.rules b { font-weight: 700; }
body { background: radial-gradient(130% 55% at 50% -5%, #226b45 0%, rgba(34, 107, 69, 0) 70%), var(--bg); background-attachment: fixed; }
.btn { transition: transform 0.08s; }
.btn:active { transform: translateY(3px); }
.btn-main { background: linear-gradient(180deg, #ffbf47, #ff9a2e); box-shadow: 0 4px 0 #b85c00; }
.btn-green { background: linear-gradient(180deg, #5ad48a, #3fbf75); box-shadow: 0 4px 0 #1f7a47; }
.btn-alt { border-color: #2f6a49; }
.iconbtn { width: 48px; height: 48px; border: 0; border-radius: 50%; background: linear-gradient(180deg, #2a6b45, #1f5c3b); color: #fff; box-shadow: 0 4px 0 #0f3a22; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.iconbtn svg { width: 24px; height: 24px; }
.iconbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0f3a22; }
.iconbtn:focus-visible, .sbtn:focus-visible, .play:focus-visible, .node:focus-visible, .sw:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.gtop { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; }
.gtop > :first-child { justify-self: start; }
.gtop > :last-child { justify-self: end; }
.gtop h2 { font-size: 1.4rem; }
.gtop .gstat { text-align: right; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }

.home { position: relative; align-items: center; justify-content: center; gap: 22px; min-height: calc(100svh - 56px); text-align: center; }
.logo { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; line-height: 0.92; }
.logo-a { font-family: var(--font-display); font-weight: 800; font-size: clamp(3.6rem, 18vw, 4.8rem); color: #fff; letter-spacing: -0.02em; text-shadow: 0 4px 0 #0a3d22, 0 8px 0 rgba(0, 0, 0, 0.28), 0 16px 24px rgba(0, 0, 0, 0.45); }
.logo-b { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.4rem, 12vw, 3.2rem); letter-spacing: 0.16em; padding-left: 0.16em; background: linear-gradient(180deg, #ffe066 10%, #ff9a2e 60%, #f76707 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #7a3300) drop-shadow(0 8px 10px rgba(0, 0, 0, 0.4)); }
.tag2 { color: var(--muted); font-size: 1.05rem; }
.showcase { position: relative; width: 100%; height: 148px; }
.sc { position: absolute; box-shadow: 0 10px 18px rgba(0, 0, 0, 0.4); animation: bob 3.2s ease-in-out infinite; }
.sc svg { width: 82%; height: 82%; }
.sc0 { width: 56px; height: 56px; left: calc(50% - 150px); top: 62px; animation-delay: -0.6s; }
.sc1 { width: 80px; height: 80px; left: calc(50% - 104px); top: 30px; animation-delay: -1.4s; }
.sc2 { width: 120px; height: 120px; left: calc(50% - 60px); top: 8px; z-index: 2; }
.sc3 { width: 80px; height: 80px; left: calc(50% + 24px); top: 30px; animation-delay: -2.2s; }
.sc4 { width: 56px; height: 56px; left: calc(50% + 94px); top: 62px; animation-delay: -0.9s; }
.fl { position: absolute; opacity: 0.5; animation: bob 4s ease-in-out infinite; }
.fl1 { width: 46px; height: 46px; top: 1%; left: 1%; }
.fl2 { width: 40px; height: 40px; top: 6%; right: 2%; animation-delay: -1.5s; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.actions { width: 100%; display: flex; flex-direction: column; gap: 14px; }
.play { width: 100%; border: 0; border-radius: 22px; padding: 14px 18px 18px; background: linear-gradient(180deg, #ffbf47, #ff9a2e); color: #3a1d00; box-shadow: 0 7px 0 #b85c00, 0 16px 26px rgba(0, 0, 0, 0.4); font-family: var(--font-display); font-weight: 800; font-size: 2.1rem; line-height: 1; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
.play small { font-family: var(--font-body); font-weight: 700; font-size: 0.9rem; letter-spacing: 0; text-transform: none; opacity: 0.8; }
.play:active { transform: translateY(5px); box-shadow: 0 2px 0 #b85c00, 0 8px 14px rgba(0, 0, 0, 0.4); }
.sec { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.sbtn { background: linear-gradient(180deg, #2a6b45, #1f5c3b); border: 0; border-radius: 16px; padding: 12px 6px; color: #fff; box-shadow: 0 4px 0 #0f3a22; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: inherit; font-weight: 700; font-size: 0.85rem; min-height: 74px; cursor: pointer; }
.sbtn svg { width: 26px; height: 26px; }
.sbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0f3a22; }
.foot { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.foot .gold, .foot b { color: var(--gold); }

.mapscroll { overflow-y: auto; height: calc(100svh - 150px); min-height: 380px; border-radius: 18px; background: linear-gradient(180deg, #12301f, #0d2017); border: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
.map { position: relative; width: 100%; }
.map > svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.node { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; color: #3a1d00; background: linear-gradient(180deg, #ffbf47, #ff9a2e); box-shadow: 0 5px 0 #b85c00, 0 9px 14px rgba(0, 0, 0, 0.4); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.node.done { background: linear-gradient(180deg, #7be0a0, #3fbf75); box-shadow: 0 5px 0 #1f7a47, 0 9px 14px rgba(0, 0, 0, 0.4); color: #06150c; }
.node.lock { background: #2c3e32; color: #7d9185; box-shadow: 0 5px 0 #1a261f; cursor: default; }
.node.cur { animation: ring 1.5s ease-out infinite; }
@keyframes ring { 0% { box-shadow: 0 5px 0 #b85c00, 0 0 0 0 rgba(255, 154, 46, 0.7); } 100% { box-shadow: 0 5px 0 #b85c00, 0 0 0 16px rgba(255, 154, 46, 0); } }
.nstars { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); font-size: 0.85rem; letter-spacing: 2px; white-space: nowrap; color: #4b5d52; line-height: 1; }
.nstars .on { color: var(--gold); }

.modal { position: fixed; inset: 0; background: rgba(4, 12, 8, 0.78); display: flex; align-items: center; justify-content: center; padding: 20px max(16px, env(safe-area-inset-left, 0px)); z-index: 30; }
.mbox { background: linear-gradient(180deg, #1d3b2b, #132a1e); border: 2px solid #2f6a49; border-radius: 22px; padding: 20px; width: 100%; max-width: 380px; max-height: 86svh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
.mbox .goals { justify-content: center; }
.mstars { font-size: 2.2rem; letter-spacing: 6px; color: #3a4a40; line-height: 1; }
.mstars .on { color: var(--gold); text-shadow: 0 2px 0 #8a6500; }
.mstars.big { font-size: 2.8rem; }
.row2 { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 700; text-align: left; padding: 6px 0; }
.sw { width: 56px; height: 32px; border-radius: 999px; border: 0; background: #3a4a40; position: relative; cursor: pointer; flex: none; transition: background 0.15s; }
.sw i { position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
.sw[aria-checked="true"] { background: var(--green); }
.sw[aria-checked="true"] i { transform: translateX(24px); }
.how { display: flex; flex-direction: column; gap: 14px; text-align: left; }
.hw { display: flex; gap: 12px; align-items: center; font-size: 0.95rem; }
.demo { position: relative; width: 48px; height: 48px; flex: none; }
.hud { display: grid; grid-template-columns: 1fr 1fr; align-items: end; }
.hud .mid { text-align: right; }
#game .goals { justify-content: center; }
@media (prefers-reduced-motion: reduce) { .tile, .face, .sw, .sw i { transition: none; } .face.sp, .sc, .fl, .node.cur { animation: none; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<linearGradient id="gMangoBase" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset=".5" stop-color="#ffa94d"/><stop offset="1" stop-color="#f76707"/></linearGradient>
<radialGradient id="gMangoBlush" cx=".75" cy=".78" r=".6"><stop offset="0" stop-color="#e03131" stop-opacity=".85"/><stop offset="1" stop-color="#e03131" stop-opacity="0"/></radialGradient>
<radialGradient id="gShine" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="gLeaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#69db7c"/><stop offset="1" stop-color="#2b8a3e"/></linearGradient>
<linearGradient id="gPine" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset=".5" stop-color="#fab005"/><stop offset="1" stop-color="#e67700"/></linearGradient>
<linearGradient id="gPlant" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf7a8"/><stop offset=".5" stop-color="#b5d92f"/><stop offset="1" stop-color="#7f9a1c"/></linearGradient>
<radialGradient id="gCacao" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#ff9e5e"/><stop offset=".5" stop-color="#d9480f"/><stop offset="1" stop-color="#7c2d12"/></radialGradient>
<radialGradient id="gCoco" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#c9976a"/><stop offset=".55" stop-color="#8d5a34"/><stop offset="1" stop-color="#4e2f17"/></radialGradient>
<linearGradient id="gPapSkin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9bd24a"/><stop offset="1" stop-color="#e6a23c"/></linearGradient>
<radialGradient id="gPapFlesh" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#ffc58a"/><stop offset="1" stop-color="#ff7a1a"/></radialGradient>
<clipPath id="pc"><ellipse cx="32" cy="40" rx="17" ry="20"/></clipPath>
</defs></svg>

<main id="app">
  <section id="home" class="home">
    <div class="fl fl1 mini t2" id="fl1" aria-hidden="true"></div>
    <div class="fl fl2 mini t0" id="fl2" aria-hidden="true"></div>
    <div class="logo"><span class="logo-a">Z'acky</span><span class="logo-b">FRUIT</span></div>
    <div class="showcase" id="showcase" aria-hidden="true"></div>
    <p class="tag2">Aligne, fais exploser, gagne !</p>
    <div class="actions">
      <button class="play" id="play" type="button"><span>Jouer</span><small id="playsub">Niveau 1</small></button>
      <div class="sec">
        <button class="sbtn" id="bLevels" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Niveaux</span></button>
        <button class="sbtn" id="bHow" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg><span>Comment jouer</span></button>
        <button class="sbtn" id="bSet" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Réglages</span></button>
      </div>
    </div>
    <p class="foot"><span class="gold">★</span> <b id="starTot">0</b> / <span id="starMax">90</span></p>
  </section>

  <section id="levels" hidden>
    <div class="gtop">
      <button class="iconbtn" id="lvBack" type="button" aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>Niveaux</h2>
      <span class="gstat">★ <span id="mapStars">0</span></span>
    </div>
    <div class="mapscroll" id="mapscroll"><div class="map" id="map"></div></div>
  </section>

/* ---------- Sons et musique (fabriqués dans le jeu, aucun fichier) ---------- */
var Snd = (function () {
  var ctx = null, master, sfx, mus, timer = null, step = 0, nextT = 0;

    sfxOn = localStorage.getItem("fruitsci-sons") !== "0";

  var BASS = [131, 0, 0, 0, 98, 0, 0, 0, 110, 0, 0, 0, 98, 0, 0, 0];
  var SCALE = [523, 587, 659, 784, 880, 1047, 1175, 1319];

  function unlock() {
    if (!ctx) {
      try {

        if (!AC) return;

  }

    if (!ctx || !sfxOn) return;
    var t = ctx.currentTime;
    if (name === "select") tone(700, t, 0.08, "sine", 0.5, sfx);
    else if (name === "swap") tone(420, t, 0.1, "triangle", 0.5, sfx, 560);
    else if (name === "bad") tone(220, t, 0.18, "sawtooth", 0.22, sfx, 140);
    else if (name === "shuffle") tone(300, t, 0.4, "sine", 0.4, sfx, 900);
    else if (name === "start") [523, 659, 784].forEach(function (f, i) { tone(f, t + i * 0.07, 0.16, "triangle", 0.4, sfx); });

function initMenu() {
  var order = [3, 1, 0, 5, 4];
  $("showcase").innerHTML = order.map(function (t, k) { return '<div class="sc sc' + k + " mini t" + t + '">' + ICONS[t] + "</div>"; }).join("");
  $("fl1").innerHTML = ICONS[2]; $("fl2").innerHTML = ICONS[0];
  $("play").onclick = function () { preLevel(unlocked()); };
  $("bLevels").onclick = showLevels;
  $("bHow").onclick = howModal;
  $("bSet").onclick = settingsModal;
  $("lvBack").onclick = home;
  $("pause").onclick = pauseModal;
  $("modal").addEventListener("click", function (e) { if (e.target === $("modal") && modalDismiss) closeModal(); });
}

/* ---------- Plateau ---------- */
function place(t, r, c) { t.r = r; t.c = c; t.el.style.setProperty("--r", r); t.el.style.setProperty("--c", c); }
function makeTile(type, r, c, spawnRow) {
  var el = document.createElement("div");
  el.className = "tile";
  el.innerHTML = '<div class="face t' + type + '">' + ICONS[type] + "</div>";
  var t = { type: type, r: r, c: c, el: el, sp: null };
  el._t = t;
  el.style.setProperty("--r", spawnRow);
  el.style.setProperty("--c", c);
  board.appendChild(el);
  void el.offsetWidth;
  place(t, r, c);
  return t;
}
function setType(t, type) {
  t.type = type;
  t.el.firstChild.className = "face t" + type;
  t.el.firstChild.innerHTML = ICONS[type];
}

function findMatches() {
  var cells = {}, groups = [], runs = [], r, c, k, j, i, cs;
  for (r = 0; r < N; r++) {
    c = 0;
    while (c < N) {
      k = c;
      while (k < N && grid[r][k] && grid[r][c] && grid[r][k].type === grid[r][c].type) k++;
      if (k - c >= 3) {
        cs = [];
        for (j = c; j < k; j++) { cells[r * N + j] = true; cs.push([r, j]); }
        groups.push(k - c); runs.push({ dir: "h", cells: cs });
      }
      c = Math.max(k, c + 1);
    }
  }
  for (c = 0; c < N; c++) {
    r = 0;
    while (r < N) {
      k = r;
      while (k < N && grid[k][c] && grid[r][c] && grid[k][c].type === grid[r][c].type) k++;
      if (k - r >= 3) {
        cs = [];
        for (i = r; i < k; i++) { cells[i * N + c] = true; cs.push([i, c]); }
        groups.push(k - r); runs.push({ dir: "v", cells: cs });
      }
      r = Math.max(k, r + 1);
    }
  }
  return { cells: cells, groups: groups, runs: runs };
}
function hasMatch() { return Object.keys(findMatches().cells).length > 0; }
function swapRefs(r1, c1, r2, c2) { var t = grid[r1][c1]; grid[r1][c1] = grid[r2][c2]; grid[r2][c2] = t; }
function hasMoves() {
  for (var r0 = 0; r0 < N; r0++) for (var c0 = 0; c0 < N; c0++) if (grid[r0][c0] && grid[r0][c0].sp) return true;
  for (var r = 0; r < N; r++) {
    for (var c = 0; c < N; c++) {
      if (c < N - 1) { swapRefs(r, c, r, c + 1); var a = hasMatch(); swapRefs(r, c, r, c + 1); if (a) return true; }
      if (r < N - 1) { swapRefs(r, c, r + 1, c); var b = hasMatch(); swapRefs(r, c, r + 1, c); if (b) return true; }
    }
  }
  return false;
}
function reshuffle() {
  var tiles = [], r, c, tries = 0;
  for (r = 0; r < N; r++) for (c = 0; c < N; c++) tiles.push(grid[r][c]);
  do {
    var types = tiles.map(function (t) { return t.type; });
    for (var i = types.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = types[i]; types[i] = types[j]; types[j] = x; }
    tiles.forEach(function (t, idx) { t.type = types[idx]; });
    tries++;
  } while ((hasMatch() || !hasMoves()) && tries < 200);
  tiles.forEach(function (t) { setType(t, t.type); });
}

function newBoard() {
  board.innerHTML = "";
  grid = [];
  var r, c, type;
  for (r = 0; r < N; r++) {
    grid[r] = [];
    for (c = 0; c < N; c++) {
      do {
        type = rand();
      } while ((c >= 2 && grid[r][c - 1].type === type && grid[r][c - 2].type === type) ||
               (r >= 2 && grid[r - 1][c].type === type && grid[r - 2][c].type === type));
      grid[r][c] = makeTile(type, r, c, r - N);
    }
  }
  if (!hasMoves()) reshuffle();
}

/* ---------- Partie ---------- */
function startLevel(n) {
  closeModal();
  gameId++;
  level = n; var L = LEVELS[n - 1];
  moves = L.m; score = 0; over = false; sel = null; busy = true;
  NT = L.t || 5;
  goal = [0, 0, 0, 0, 0, 0]; goalTypes = [];
  Object.keys(L.g).forEach(function (k) { goal[k] = L.g[k]; goalTypes.push(parseInt(k, 10)); });
  show("game");
  $("over").hidden = true;
  Snd.play("start");
  $("lvtitle").textContent = "Niveau " + n;
  newBoard(); hud();
  wait(550).then(function () { busy = false; });
}

function hud() {
  $("score").textContent = score;
  $("moves").textContent = moves;
  var h = "";
  goalTypes.forEach(function (t) {
    var left = goal[t];
    h += '<div class="chip' + (left <= 0 ? " done" : "") + '" title="' + NAMES[t] + '"><div class="mini t' + t + '">' + ICONS[t] + "</div><span>" + (left <= 0 ? "✓" : left) + "</span></div>";
  });
  $("goals").innerHTML = h;
}
function toast(msg) {
  var t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("on"); }, 900);
}

function select(t) { clearSel(); sel = t; t.el.classList.add("sel"); Snd.play("select"); }
function clearSel() { if (sel) sel.el.classList.remove("sel"); sel = null; }
function swapTiles(a, b) {
  var ar = a.r, ac = a.c, br = b.r, bc = b.c;
  grid[ar][ac] = b; grid[br][bc] = a;
  place(a, br, bc); place(b, ar, ac);
}
function adjacent(a, b) { return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1; }
function tap(t) {
  if (!sel) { select(t); return; }
  if (sel === t) { clearSel(); return; }
  if (adjacent(sel, t)) { trySwap(sel, t); return; }
  select(t);
}

async function trySwap(a, b) {
  if (busy || over || !a || !b) return;
  busy = true; clearSel();
  var gid = gameId;
  Snd.play("swap");
  swapTiles(a, b);
  await wait(200);
  if (gid !== gameId) return;
  var forced = null;
  if (a.sp || b.sp) {
    forced = [];
    [[a, b], [b, a]].forEach(function (p) {
      var s = p[0], o = p[1];
      if (s.sp === "b") { s.tt = o.sp === "b" ? "all" : o.type; forced.push(s); }
      else if (s.sp) forced.push(s);
    });
  }
  if (!forced && !hasMatch()) { Snd.play("bad"); swapTiles(a, b); await wait(200); busy = false; return; }
  moves--; hud();
  await resolve(forced, [a, b]);
  if (gid !== gameId) return;
  if (!over && !hasMoves()) { toast("Mélange !"); Snd.play("shuffle"); reshuffle(); await wait(250); }
  if (over) { busy = false; return; }
  var won = goalTypes.every(function (t) { return goal[t] <= 0; });
  if (won) endGame(true); else if (moves <= 0) endGame(false);
  busy = false;
}

/* Bonus : 4 fruits alignés = ligne ou colonne, 5 fruits = super fruit, forme en L ou T = explosion 3x3 */
var rem, queue, madeAt;
function add(r, c) {
  if (r < 0 || c < 0 || r >= N || c >= N) return;
  var t = grid[r][c], k = r * N + c;
  if (!t || rem[k] || madeAt[k]) return;
  rem[k] = t;
  if (t.sp) queue.push(t);
}
function pickCell(run, tiles) {
  if (tiles) {
    for (var i = 0; i < tiles.length; i++) {
      for (var j = 0; j < run.cells.length; j++) {
        if (run.cells[j][0] === tiles[i].r && run.cells[j][1] === tiles[i].c) return run.cells[j];
      }
    }
  }
  return run.cells[Math.floor(run.cells.length / 2)];
}
function setSpecial(t, sp) {
  t.sp = sp;
  t.el.firstChild.className = "face t" + t.type + (sp ? " sp sp-" + sp : "");
}

async function resolve(forced, swapped) {
  var combo = 0, rank = { h: 1, v: 1, x: 2, b: 3 }, gid = gameId;
  while (true) {
    var res = findMatches();
    rem = {}; queue = []; madeAt = {};
    var inH = {}, inV = {};
    res.runs.forEach(function (run) {
      run.cells.forEach(function (p) { (run.dir === "h" ? inH : inV)[p[0] * N + p[1]] = true; });
    });
    res.runs.forEach(function (run) {
      if (run.cells.length < 4) return;
      var p = pickCell(run, swapped), k = p[0] * N + p[1];
      if (grid[p[0]][p[1]].sp) return;
      var sp = run.cells.length >= 5 ? "b" : (run.dir === "h" ? "h" : "v");
      if (!madeAt[k] || rank[sp] > rank[madeAt[k]]) madeAt[k] = sp;
    });
    Object.keys(inH).forEach(function (k) {
      if (inV[k] && !madeAt[k]) {
        var tt0 = grid[Math.floor(k / N)][k % N];
        if (!tt0.sp) madeAt[k] = "x";
      }
    });
    Object.keys(res.cells).forEach(function (k) { add(Math.floor(k / N), k % N); });
    if (forced) forced.forEach(function (t) { add(t.r, t.c); });
    var activated = 0;
    while (queue.length) {
      var s = queue.shift(), i2, j2;
      activated++;
      if (s.sp === "h") { for (j2 = 0; j2 < N; j2++) add(s.r, j2); }
      else if (s.sp === "v") { for (i2 = 0; i2 < N; i2++) add(i2, s.c); }
      else if (s.sp === "x") { for (i2 = -1; i2 <= 1; i2++) for (j2 = -1; j2 <= 1; j2++) add(s.r + i2, s.c + j2); }
      else if (s.sp === "b") {
        var target = s.tt === undefined ? s.type : s.tt;
        for (i2 = 0; i2 < N; i2++) for (j2 = 0; j2 < N; j2++) {
          if (grid[i2][j2] && (target === "all" || grid[i2][j2].type === target)) add(i2, j2);
        }
      }
    }
    var keys = Object.keys(rem);
    if (!keys.length) break;
    combo++;
    var pts = keys.length * 10 + activated * 40;
    res.groups.forEach(function (g) { if (g > 3) pts += (g - 3) * 20; });
    score += pts * combo;
    var popped = [];
    keys.forEach(function (k) {
      var t = rem[k];
      if (goal[t.type] > 0) goal[t.type]--;
      t.el.classList.add("pop"); popped.push(t.el); grid[t.r][t.c] = null;
    });
    var made = Object.keys(madeAt);
    made.forEach(function (k) {
      var t = grid[Math.floor(k / N)][k % N];
      if (t) setSpecial(t, madeAt[k]);
    });
    Snd.pop(combo, activated > 0 || res.groups.some(function (g) { return g >= 4; }));
    if (made.length || activated) Snd.play("bonus");
    if (activated) toast("Boom !");
    else if (made.length) toast("Bonus !");
    else if (combo > 1) toast("Combo x" + combo + " !");
    hud();
    await wait(230);
    if (gid !== gameId) return;
    popped.forEach(function (el) { if (el.parentNode) el.parentNode.removeChild(el); });
    for (var c = 0; c < N; c++) {
      var w = N - 1, r;
      for (r = N - 1; r >= 0; r--) {
        if (grid[r][c]) {
          if (r !== w) { var t2 = grid[r][c]; grid[w][c] = t2; grid[r][c] = null; place(t2, w, c); }
          w--;
        }
      }
      var empty = w + 1;
      for (r = w; r >= 0; r--) grid[r][c] = makeTile(rand(), r, c, r - empty);
    }
    forced = null; swapped = null;
    await wait(300);
    if (gid !== gameId) return;
  }
}

/* ---------- Fin de partie ---------- */
function endGame(win) {
  over = true;
  Snd.play(win ? "win" : "lose");
  var L = LEVELS[level - 1], box = "";
  if (win) {
    var ratio = moves / L.m, stars = ratio >= 0.4 ? 3 : (ratio >= 0.15 ? 2 : 1);
    saveStars(level, stars);
    if (level < LEVELS.length && level + 1 > unlocked()) saveUnlocked(level + 1);
    var last = level === LEVELS.length;
    var text = "J'ai réussi le niveau " + level + " de Z'acky Fruit avec " + score + " points ! Tu peux faire mieux ?";
    box = '<div class="box">' + starsHtml(stars, "big") +
      "<h2>" + (last ? "Tu as tout fini !" : "Bravo !") + "</h2>" +
      '<p class="lead">' + score + " points, " + moves + " coups restants.</p>" +
      (last ? "" : '<button class="btn btn-main" id="nx" type="button">Niveau suivant</button>') +
      '<a class="btn btn-alt" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(text) + '">Partager sur WhatsApp</a>' +
      '<button class="btn btn-alt" id="mn" type="button">Niveaux</button></div>';
  } else {
    box = '<div class="box"><h2>Perdu</h2><p class="lead">Il n\'y a plus de coups. Essaie encore, tu y es presque.</p>' +
      '<button class="btn btn-main" id="rt" type="button">Réessayer</button><button class="btn btn-alt" id="mn" type="button">Niveaux</button></div>';
  }
  $("over").innerHTML = box; $("over").hidden = false;
  if ($("nx")) $("nx").onclick = function () { startLevel(level + 1); };
  if ($("rt")) $("rt").onclick = function () { startLevel(level); };
  $("mn").onclick = showLevels;
}

/* ---------- Doigt : toucher ou glisser ---------- */
board.addEventListener("pointerdown", function (e) {
  if (busy || over) return;
  var el = e.target.closest(".tile");
  if (!el || !el._t) return;
  drag = { t: el._t, x: e.clientX, y: e.clientY, done: false };
  try { board.setPointerCapture(e.pointerId); } catch (err) {}
});
board.addEventListener("pointermove", function (e) {
  if (!drag || drag.done || busy || over) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y, th = board.clientWidth / N * 0.35;
  if (Math.abs(dx) < th && Math.abs(dy) < th) return;
  drag.done = true;
  var r = drag.t.r, c = drag.t.c;
  if (Math.abs(dx) > Math.abs(dy)) c += dx > 0 ? 1 : -1; else r += dy > 0 ? 1 : -1;
  if (r < 0 || c < 0 || r >= N || c >= N) return;
  trySwap(drag.t, grid[r][c]);
});
board.addEventListener("pointerup", function () {
  if (!drag) return;
  var d = drag; drag = null;
  if (d.done || busy || over) return;
  tap(d.t);
});
board.addEventListener("pointercancel", function () { drag = null; });

/* Le navigateur n'autorise le son qu'après un premier toucher */
document.addEventListener("pointerdown", function () { Snd.unlock(); }, true);
Snd.bind();
initMenu();
home();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
