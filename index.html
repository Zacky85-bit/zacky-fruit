:root {

  color-scheme: dark;
}
* { box-sizing: border-box; }
body {

}

      if (t) setSpecial(t, madeAt[k]);
    });
    Snd.pop(combo, activated > 0 || res.groups.some(function (g) { return g >= 4; }));
    if (made.length || activated) Snd.play("bonus");
    if (brokeCrate) toast("Caisse cassée !");
    else if (clearedHoney) toast("Miel nettoyé !");
    else if (activated) toast("Boom !");
    else if (made.length) toast("Bonus !");
    else if (combo > 1) toast("Combo x" + combo + " !");
    hud();
    await wait(230);
    if (gid !== gameId) return;
    popped.forEach(function (el) { if (el.parentNode) el.parentNode.removeChild(el); });
    var landed = [];
    for (var c = 0; c < N; c++) {
      /* Les caisses ne tombent pas : chaque colonne est coupée en morceaux entre les caisses */
      var r = N - 1;
      while (r >= 0) {
        if (grid[r][c] && grid[r][c].crate) { r--; continue; }
        var top = r;
        while (top - 1 >= 0 && !(grid[top - 1][c] && grid[top - 1][c].crate)) top--;
        var w = r, i;
        for (i = r; i >= top; i--) {
          if (grid[i][c]) {
            if (i !== w) { var t2 = grid[i][c]; grid[w][c] = t2; grid[i][c] = null; place(t2, w, c); landed.push(t2); }
            w--;
          }
        }
        var empty = w - top + 1;
        for (i = w; i >= top; i--) { var nt = makeTile(rand(), i, c, top > 0 ? Math.max(i - empty, top - 1) : i - empty); grid[i][c] = nt; landed.push(nt); }
        r = top - 1;
      }
    }
    FX.land(landed);
    forced = null; swapped = null;
    await wait(300);
    if (gid !== gameId) return;
  }
}

/* ---------- Fin de partie ---------- */
function getRecords() { try { return JSON.parse(localStorage.getItem("fruitsci-records") || "{}") || {}; } catch (e) { return {}; } }
function saveRecord(l, v) { var o = getRecords(); o[l] = v; try { localStorage.setItem("fruitsci-records", JSON.stringify(o)); } catch (e) {} }
function countUp(el, to) {
  if (typeof requestAnimationFrame !== "function") { el.textContent = to; return; }
  var t0 = null, dur = 900;
  function step(ts) {
    if (t0 === null) t0 = ts;
    var k = Math.min(1, (ts - t0) / dur);
    el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function endGame(win) {
  over = true;
  clearHint();
  Snd.play(win ? "win" : "lose");
  if (!win) loseLife();
  var L = LEVELS[level - 1], box = "", gid = gameId, stars = 0;
  if (win) {
    var ratio = moves / L.m;
    stars = ratio >= 0.4 ? 3 : (ratio >= 0.15 ? 2 : 1);
    var isRec = score > (getRecords()[level] || 0);
    if (isRec) saveRecord(level, score);
    saveStars(level, stars);
    if (level < LEVELS.length && level + 1 > unlocked()) saveUnlocked(level + 1);
    var last = level === LEVELS.length;
    var text = "J'ai réussi le niveau " + level + " de Z'acky Fruit avec " + score + " points ! Tu peux faire mieux ?";
    var sh = "";
    for (var i = 0; i < 3; i++) sh += '<span class="' + (i < stars ? "on" : "") + '" style="--i:' + i + '">★</span>';
    box = '<div class="box win"><div class="vs" role="img" aria-label="' + stars + ' étoiles sur 3">' + sh + "</div>" +
      "<h2>" + (last ? "Tu as tout fini !" : "Bravo !") + "</h2>" +
      '<div class="vscore" id="vscore">0</div><p class="small">points</p>' +
      (isRec ? '<span class="tag tagc">Nouveau record</span>' : "") +
      '<p class="lead">' + moves + (moves > 1 ? " coups restants" : " coup restant") + "</p>" +
      (last ? "" : '<button class="btn btn-main" id="nx" type="button">Niveau suivant</button>') +
      '<a class="btn btn-alt" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(text) + '">Partager sur WhatsApp</a>' +
      '<button class="btn btn-alt" id="mn" type="button">Niveaux</button></div>';
  } else {
    var left = "";
    goalTypes.forEach(function (t) {
      if (goal[t] > 0) left += '<div class="chip" title="' + NAMES[t] + '"><div class="mini t' + t + '">' + ICONS[t] + "</div><span>" + goal[t] + "</span></div>";
    });
    box = '<div class="box"><h2>Dommage !</h2><p class="lead">Il te manquait encore :</p><div class="goals">' + left + "</div>" +
      '<p class="small">Vies : ' + livesHtml() + '</p><button class="btn btn-main" id="rt" type="button">Réessayer</button><button class="btn btn-alt" id="mn" type="button">Niveaux</button></div>';
  }
  $("over").innerHTML = box; $("over").hidden = false;
  if ($("nx")) $("nx").onclick = function () { startLevel(level + 1); };
  if ($("rt")) $("rt").onclick = function () { startLevel(level); };
  $("mn").onclick = showLevels;
  if (win) {
    FX.confetti();
    countUp($("vscore"), score);
    for (var k = 0; k < stars; k++) {
      (function (j) { setTimeout(function () { if (gid === gameId) Snd.play("star", j); }, 500 + j * 350); })(k);
    }
  }
}

/* ---------- Doigt : toucher ou glisser ---------- */
board.addEventListener("pointerdown", function (e) {
  if (busy || over) return;
  var el = e.target.closest(".tile");
  if (!el || !el._t || el._t.crate) return;
  drag = { t: el._t, x: e.clientX, y: e.clientY, done: false };
  try { board.setPointerCapture(e.pointerId); } catch (err) {}
});
board.addEventListener("pointermove", function (e) {
  if (!drag || drag.done || busy || over) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y, th = board.clientWidth / N * 0.35;
  if (Math.abs(dx) < th && Math.abs(dy) < th) return;
  drag.done = true;
  var r = drag.t.r, c = drag.t.c;
  if (Math.abs(dx) > Math.abs(dy)) c += dx > 0 ? 1 : -1; else r += dy > 0 ? 1 : -1;
  if (r < 0 || c < 0 || r >= N || c >= N) return;
  trySwap(drag.t, grid[r][c]);
});
board.addEventListener("pointerup", function () {
  if (!drag) return;
  var d = drag; drag = null;
  if (d.done || busy || over) return;
  tap(d.t);
});
board.addEventListener("pointercancel", function () { drag = null; });

/* Le navigateur n'autorise le son qu'après un premier toucher */
document.addEventListener("pointerdown", function () { Snd.unlock(); }, true);
Snd.bind();
initMenu();
home();
</script>
